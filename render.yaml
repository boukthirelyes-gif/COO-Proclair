services:
  - type: web
    name: coo-proclair
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev --ignore-scripts && npm run db:generate && node scripts/render-predeploy.mjs && npm run build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: PROCLAIR_ADMIN_PASSWORD
        sync: false
      - key: PROCLAIR_SESSION_SECRET
        sync: false
      - key: PROCLAIR_PUBLIC_ORIGIN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: TWILIO_SEND_ENABLED
        value: 'false'
      - key: TWILIO_VOICE_ENABLED
        value: 'false'
