name: Validate Proclair
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proclair
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: proclair_test
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U proclair" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_test
      TEST_DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: node scripts/render-parity.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s tests -v
      - run: npm run check:secrets
  superhub-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proclair
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: proclair_test
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U proclair" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_test
      E2E_DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_browser_test
      E2E_BASE_URL: http://127.0.0.1:3102
      E2E_PREVIEW_BASE_URL: http://127.0.0.1:3103
      PROCLAIR_ADMIN_PASSWORD: ci_only_admin_password
      PROCLAIR_SESSION_SECRET: ci_only_session_secret_minimum_32_characters
      TWILIO_SEND_ENABLED: 'false'
      TWILIO_VOICE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - name: Create separate browser database
        run: node --input-type=module -e 'import pg from "pg"; const db=new pg.Client({connectionString:process.env.DATABASE_URL}); await db.connect(); await db.query("CREATE DATABASE proclair_browser_test"); await db.end();'
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_browser_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node --input-type=module -e 'import {chromium} from "playwright"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV,"CHROMIUM_PATH="+chromium.executablePath()+"\n");'
      - name: Start isolated CRM and wait for database health
        run: |
          DATABASE_URL="$E2E_DATABASE_URL" node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3102 > /tmp/proclair-browser.log 2>&1 &
          DATABASE_URL="$E2E_DATABASE_URL" VERCEL=1 VERCEL_URL=coo-proclair-access-fixture.vercel.app PROCLAIR_PUBLIC_ORIGIN=https://coo-proclair.vercel.app/ node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3103 > /tmp/proclair-preview.log 2>&1 &
          node --input-type=module -e 'for(const base of [process.env.E2E_BASE_URL,process.env.E2E_PREVIEW_BASE_URL]){let ready=false; for(let i=0;i<60;i++){try{const r=await fetch(base+"/api/health"); if(r.ok){ready=true;break}}catch{} await new Promise(resolve=>setTimeout(resolve,1000))} if(!ready)process.exit(1);}'
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:superhub:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:team:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:omega-operations:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:omega-supervisor:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:access-calendar:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:native-core:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:leaderboard:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:archive-gates:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:omega-workspace:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:lead-table:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:map-filters:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:territories:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:users-map:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:customer-table:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:settings-workspace:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:business-hours:e2e
      - run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:password-reset:e2e
      - name: Save server diagnostics on browser failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proclair-browser-server-diagnostics
          path: |
            /tmp/proclair-browser.log
            /tmp/proclair-preview.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Extended CRM browser audit 1/15 — test:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:e2e
      - name: Extended CRM browser audit 2/15 — test:finance:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:finance:e2e
      - name: Extended CRM browser audit 3/15 — test:integrations:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:integrations:e2e
      - name: Extended CRM browser audit 4/15 — test:agreements:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:agreements:e2e
      - name: Extended CRM browser audit 5/15 — test:compatibility:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:compatibility:e2e
      - name: Extended CRM browser audit 6/15 — test:leads:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:leads:e2e
      - name: Extended CRM browser audit 7/15 — test:portal:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:portal:e2e
      - name: Extended CRM browser audit 8/15 — test:providers:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:providers:e2e
      - name: Extended CRM browser audit 9/15 — test:quotes:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:quotes:e2e
      - name: Extended CRM browser audit 10/15 — test:rotor-files:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:rotor-files:e2e
      - name: Extended CRM browser audit 11/15 — test:sales-followups:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:sales-followups:e2e
      - name: Extended CRM browser audit 12/15 — test:seller-sales:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:seller-sales:e2e
      - name: Extended CRM browser audit 13/15 — test:usability:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:usability:e2e
      - name: Extended CRM browser audit 14/15 — test:v30-import:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:v30-import:e2e
      - name: Extended CRM browser audit 15/15 — test:v30:e2e
        run: |
          node tests/reset-browser-login-attempts.mjs
          npm run test:v30:e2e
