name: Validate Proclair
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proclair
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: proclair_test
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U proclair" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_test
      TEST_DATABASE_URL: postgresql://proclair:ci_only_password@localhost:5433/proclair_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -m unittest discover -s tests -v
      - run: npm run check:secrets
